version: 2

updates:
  # Dependabot does not recurse, so include each managed workflow and action directory.
  - package-ecosystem: github-actions
    directories:
      - /
      - /terraform/*/.github/workflows
      - /terraform/*/.github/actions/*
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - github-actions
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    cooldown:
      default-days: 7
