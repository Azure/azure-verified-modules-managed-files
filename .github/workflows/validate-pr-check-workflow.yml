---
name: Validate PR Check Workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: "[AVM] Validate PR Check Workflow"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate PR check caller
        shell: pwsh
        run: ./scripts/Test-PrCheckWorkflow.ps1
