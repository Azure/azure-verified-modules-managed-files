---
name: Validate Issue Triage Release Status

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform/root/.github/workflows/issue-triage.md"
      - "terraform/root/.github/workflows/issue-triage.lock.yml"
      - "scripts/Test-IssueTriageReleaseStatus.ps1"
      - "scripts/Test-IssueTriageSafetyGate.ps1"
      - ".github/workflows/validate-issue-triage-release-status.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: "[AVM] Validate Issue Triage Release Status"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise canonical and compiled release proof
        shell: pwsh
        run: |
          ./scripts/Test-IssueTriageReleaseStatus.ps1
          ./scripts/Test-IssueTriageReleaseStatus.ps1 -WorkflowPath ./terraform/root/.github/workflows/issue-triage.lock.yml

      - name: Prepare pinned triage runtime
        uses: github/gh-aw-actions/setup@2709137ea6c5b0e19aa621454dc643ea8dc526b1 # v0.85.4
        with:
          destination: ${{ runner.temp }}/triage-runtime
          job-name: ${{ github.job }}

      - name: Exercise canonical and compiled output gate
        shell: pwsh
        run: |
          ./scripts/Test-IssueTriageSafetyGate.ps1 -RuntimeDirectory '${{ runner.temp }}/triage-runtime'
          ./scripts/Test-IssueTriageSafetyGate.ps1 -RuntimeDirectory '${{ runner.temp }}/triage-runtime' -WorkflowPath ./terraform/root/.github/workflows/issue-triage.lock.yml
