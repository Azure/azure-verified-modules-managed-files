---
name: Validate File Group Config

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/_config.json"
      - "terraform/**"
      - "**/.github/workflows/**"
      - "scripts/Test-WorkflowShaPins*.ps1"
      - "scripts/Test-FileGroupConfig.ps1"
      - "scripts/Test-TerraformWorkflowRef.ps1"
      - ".github/workflows/validate-file-group-config.yml"
  workflow_dispatch:

jobs:
  validate:
    name: "[AVM] Validate File Group Config"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate file group config
        shell: pwsh
        run: ./scripts/Test-FileGroupConfig.ps1

      - name: Validate Terraform workflow ref
        shell: pwsh
        run: ./scripts/Test-TerraformWorkflowRef.ps1

      - name: Install YAML parser
        shell: pwsh
        run: Install-PSResource -Name powershell-yaml -Version 0.4.12 -Scope CurrentUser -TrustRepository

      - name: Validate all workflow SHA pins
        shell: pwsh
        run: |
          ./scripts/Test-WorkflowShaPins.Tests.ps1
          ./scripts/Test-WorkflowShaPins.ps1
