name: PR Check Label Rerun

on:
  pull_request_target:
    types: ['labeled', 'unlabeled']

concurrency:
  group: pr-check-label-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  actions: write
  pull-requests: read

jobs:
  rerun-pr-check:
    if: >-
      github.event.label.name == 'PR: Run Required E2E Tests' ||
      github.event.label.name == 'PR: Run All E2E Tests'
    name: rerun PR check
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Rerun PR check for current head
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-GhApi {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [string[]] $Arguments
              )

              $output = & gh api @Arguments
              if ($LASTEXITCODE -ne 0) {
                  throw [System.InvalidOperationException]::new(
                      "GitHub API request failed with exit code $LASTEXITCODE."
                  )
              }

              return ($output | Out-String).Trim()
          }

          function Invoke-GhApiJson {
              [CmdletBinding()]
              param(
                  [Parameter(Mandatory)]
                  [string[]] $Arguments
              )

              $content = Invoke-GhApi -Arguments $Arguments
              if ([string]::IsNullOrWhiteSpace($content)) {
                  throw [System.InvalidOperationException]::new(
                      'GitHub API returned an empty response when JSON was required.'
                  )
              }

              return $content | ConvertFrom-Json -ErrorAction Stop
          }

          function Get-LivePullRequest {
              $pullRequest = Invoke-GhApiJson -Arguments @(
                  "repos/$env:REPOSITORY/pulls/$env:PULL_REQUEST"
              )
              if ($pullRequest.state -cne 'open') {
                  throw [System.InvalidOperationException]::new(
                      "Pull request #$env:PULL_REQUEST is not open."
                  )
              }

              if ([string] $pullRequest.head.repo.full_name -cne $env:REPOSITORY) {
                  throw [System.InvalidOperationException]::new(
                      "Pull request #$env:PULL_REQUEST is from a fork; use a same-repository release-branch handoff before requesting E2E tests."
                  )
              }

              if ([string] $pullRequest.head.sha -notmatch '^[0-9a-f]{40}$') {
                  throw [System.InvalidDataException]::new(
                      "Pull request #$env:PULL_REQUEST has an invalid head SHA."
                  )
              }

              return $pullRequest
          }

          $deadline = [DateTime]::UtcNow.AddMinutes(115)
          $missingRunDeadline = [DateTime]::UtcNow.AddMinutes(10)
          $headSha = ''
          $pullRequestNumber = 0
          if (-not [int]::TryParse($env:PULL_REQUEST, [ref] $pullRequestNumber) -or
              $pullRequestNumber -lt 1) {
              throw [System.InvalidDataException]::new(
                  'The pull request number must be a positive integer.'
              )
          }

          while ([DateTime]::UtcNow -lt $deadline) {
              $pullRequest = Get-LivePullRequest
              if ($headSha -cne $pullRequest.head.sha) {
                  $headSha = [string] $pullRequest.head.sha
                  $missingRunDeadline = [DateTime]::UtcNow.AddMinutes(10)
                  Write-Host "Waiting for the pull_request PR Check at head $headSha."
              }

              $pages = @(Invoke-GhApiJson -Arguments @(
                  '--paginate',
                  '--slurp',
                  "repos/$env:REPOSITORY/actions/workflows/pr-check.yml/runs?event=pull_request&head_sha=$headSha&per_page=100"
              ))
              $run = @(
                  $pages |
                      ForEach-Object { @($_.workflow_runs) } |
                      Where-Object {
                          $_.event -ceq 'pull_request' -and
                          $_.head_sha -ceq $headSha -and
                          @(
                              $_.pull_requests |
                                  Where-Object { $_.number -eq $pullRequestNumber }
                          ).Count -gt 0
                      } |
                      Sort-Object -Property created_at -Descending |
                      Select-Object -First 1
              )

              if ($run.Count -eq 0) {
                  if ([DateTime]::UtcNow -ge $missingRunDeadline) {
                      throw [System.InvalidOperationException]::new(
                          "No pull_request PR Check run was found for pull request #$env:PULL_REQUEST at head $headSha."
                      )
                  }

                  Start-Sleep -Seconds 15
                  continue
              }

              if ($run[0].status -cne 'completed') {
                  Write-Host "PR Check run $($run[0].id) is $($run[0].status); waiting for it to complete."
                  Start-Sleep -Seconds 15
                  continue
              }

              $latestPullRequest = Get-LivePullRequest
              if ($latestPullRequest.head.sha -cne $headSha) {
                  Write-Host 'The pull request head changed; selecting the PR Check for the new head.'
                  continue
              }

              $null = Invoke-GhApi -Arguments @(
                  '--method',
                  'POST',
                  "repos/$env:REPOSITORY/actions/runs/$($run[0].id)/rerun"
              )
              Write-Host "Requested a full rerun of PR Check run $($run[0].id) for head $headSha."
              exit 0
          }

          throw [System.TimeoutException]::new(
              "Timed out waiting for the pull_request PR Check for pull request #$env:PULL_REQUEST to complete."
          )
