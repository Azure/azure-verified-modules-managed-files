name: PR Check Label Rerun

on:
  workflow_run:
    workflows: ['PR Check Label Observer']
    types: ['completed']

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

jobs:
  rerun-pr-check:
    uses: Azure/azure-verified-modules-tools/.github/workflows/pr-check-label-rerun.yml@5be28c8db7f04f75a7fb6a195ed89678885cc280
    with:
      tools-ref: '5be28c8db7f04f75a7fb6a195ed89678885cc280'
      observer-workflow-path: '.github/workflows/pr-check-label-observer.yml'
