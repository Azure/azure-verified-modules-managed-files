---
name: Copy Issue Labels to PR

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  issues: write
  pull-requests: read

concurrency:
  group: copy-issue-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  copy-labels:
    name: Copy release-note labels
    # Pull requests from forks get a read-only token and cannot be labeled.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Copy labels from closing issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          is_release_note_label() {
            case "$1" in
              "Type: Bug :bug:" | \
              "Type: Feature Request :heavy_plus_sign:" | \
              "Type: Documentation :page_facing_up:" | \
              "Type: CI :rocket:" | \
              "Type: Hygiene :broom:" | \
              dependencies | \
              github-actions | \
              github_actions | \
              bug | \
              enhancement | \
              documentation)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          closing_issues_file="$(mktemp)"
          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json closingIssuesReferences \
            --jq '.closingIssuesReferences[].number' > "$closing_issues_file"

          if [ ! -s "$closing_issues_file" ]; then
            echo "No closing issues found."
            exit 0
          fi

          labels_file="$(mktemp)"
          while IFS= read -r issue; do
            gh issue view "$issue" \
              --repo "$REPOSITORY" \
              --json labels \
              --jq '.labels[].name' >> "$labels_file"
          done < "$closing_issues_file"

          release_labels_file="$(mktemp)"
          while IFS= read -r label; do
            if is_release_note_label "$label"; then
              printf '%s\n' "$label"
            fi
          done < "$labels_file" | sort -u > "$release_labels_file"

          if [ ! -s "$release_labels_file" ]; then
            echo "No release-note labels found on closing issues."
            exit 0
          fi

          while IFS= read -r label; do
            echo "Adding label: ${label}"
            gh issue edit "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --add-label "$label" || true
          done < "$release_labels_file"

          gh issue edit "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --remove-label "Needs: Triage :mag:" || true
