---
name: Copy Issue Labels to PR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: copy-issue-labels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  copy-labels:
    name: Copy release-note labels
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy labels from closing issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const RELEASE_NOTE_LABELS = new Set([
              'Type: Bug :bug:',
              'Type: Feature Request :heavy_plus_sign:',
              'Type: Documentation :page_facing_up:',
              'Type: CI :rocket:',
              'Type: Hygiene :broom:',
              'dependencies',
              'github-actions',
              'github_actions',
              'bug',
              'enhancement',
              'documentation',
            ]);
            const TRIAGE_LABEL = 'Needs: Triage :mag:';

            const query = `
              query($owner: String!, $name: String!, $oid: GitObjectID!) {
                repository(owner: $owner, name: $name) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: 10) {
                        nodes {
                          number
                          merged
                          closingIssuesReferences(first: 20) {
                            nodes {
                              labels(first: 100) {
                                nodes { name }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const { owner, repo } = context.repo;
            const pushed = (context.payload.commits ?? [])
              .map((commit) => commit.id)
              .filter(Boolean);
            const commits = new Set([context.sha, ...pushed].filter(Boolean));

            const labelsByPullRequest = new Map();

            for (const oid of commits) {
              const result = await github.graphql(query, { owner, name: repo, oid });
              const pullRequests =
                result.repository?.object?.associatedPullRequests?.nodes ?? [];

              for (const pullRequest of pullRequests) {
                if (!pullRequest?.merged) {
                  continue;
                }

                const labels =
                  labelsByPullRequest.get(pullRequest.number) ?? new Set();

                for (const issue of pullRequest.closingIssuesReferences?.nodes ?? []) {
                  for (const label of issue?.labels?.nodes ?? []) {
                    if (RELEASE_NOTE_LABELS.has(label.name)) {
                      labels.add(label.name);
                    }
                  }
                }

                labelsByPullRequest.set(pullRequest.number, labels);
              }
            }

            if (labelsByPullRequest.size === 0) {
              core.info('No merged pull requests found for this push.');
              return;
            }

            // A label copied from an issue already exists in that issue's
            // repository, so a 404 here means it is absent from this one.
            const ignoreMissing = async (description, request) => {
              try {
                await request();
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                core.warning(`${description} failed because it does not exist.`);
              }
            };

            for (const [issue_number, labels] of labelsByPullRequest) {
              if (labels.size === 0) {
                core.info(`#${issue_number}: no release-note labels on closing issues.`);
                continue;
              }

              const names = [...labels].sort();
              core.info(`#${issue_number}: adding ${names.join(', ')}`);

              await ignoreMissing(`Adding labels to #${issue_number}`, () =>
                github.rest.issues.addLabels({ owner, repo, issue_number, labels: names }),
              );

              await ignoreMissing(`Removing '${TRIAGE_LABEL}' from #${issue_number}`, () =>
                github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: TRIAGE_LABEL,
                }),
              );
            }
