---
name: Copy Issue Labels to PR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

# No concurrency group on purpose. GitHub keeps only one pending run per group,
# so a third rapid push would evict the second one and its pull request would
# never be labeled. Every operation here is idempotent, so overlapping runs are
# harmless.

jobs:
  copy-labels:
    name: Copy release-note labels
    # A created, deleted, or force-pushed branch does not represent a merge,
    # and any of them can leave an unrelated commit as the tip.
    if: ${{ !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy labels from closing issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TRIAGE_LABEL: "Needs: Triage :mag:"
        run: |
          set -euo pipefail

          # comm requires its inputs sorted the same way it compares them.
          export LC_ALL=C

          # Labels worth carrying onto a pull request, matching the categories
          # and exclusions in .github/release.yml. These are passed to gh as a
          # comma-separated list, so a label name may not contain a comma.
          allowed="$(mktemp)"
          sort -u > "$allowed" <<'LABELS'
          Type: Bug :bug:
          Type: Feature Request :heavy_plus_sign:
          Type: Documentation :page_facing_up:
          Type: CI :rocket:
          Type: Hygiene :broom:
          dependencies
          github-actions
          github_actions
          bug
          enhancement
          documentation
          LABELS

          # Labels this repository actually has. Adding an unknown label fails
          # the call, so intersect with this rather than guessing.
          known="$(mktemp)"
          gh label list --limit 500 --json name --jq '.[].name' | sort -u > "$known"

          # GitHub caps the pushed commit list at 20 entries, but the tip alone
          # identifies the pull request for squash, merge, and rebase merges.
          commits="$(jq -r '[.after] + [.commits[]?.id] | .[] | select(. != null and . != "")' \
            "$GITHUB_EVENT_PATH" | sort -u)"

          # One query per commit yields its merged pull requests, their closing
          # issues, and those issues' labels.
          query='
            query($owner: String!, $name: String!, $oid: GitObjectID!) {
              repository(owner: $owner, name: $name) {
                object(oid: $oid) {
                  ... on Commit {
                    associatedPullRequests(first: 20) {
                      nodes {
                        number
                        merged
                        baseRefName
                        closingIssuesReferences(first: 20) {
                          nodes { labels(first: 100) { nodes { name } } }
                        }
                      }
                    }
                  }
                }
              }
            }'

          # Emit "<pull request>\t<label>" pairs, one per line.
          pairs="$(mktemp)"
          for oid in $commits; do
            gh api graphql -f query="$query" \
              -f owner="${GH_REPO%/*}" -f name="${GH_REPO#*/}" -f oid="$oid" \
              | jq -r --arg branch "$BRANCH" '
                  .data.repository.object.associatedPullRequests.nodes[]?
                  | select(.merged and .baseRefName == $branch)
                  | .number as $number
                  | .closingIssuesReferences.nodes[]?.labels.nodes[]?.name
                  | "\($number)\t\(.)"'
          done | sort -u > "$pairs"

          if [ ! -s "$pairs" ]; then
            echo "This push merged no pull requests with labeled closing issues."
            exit 0
          fi

          for pr in $(cut -f1 "$pairs" | sort -nu); do
            echo "::group::Pull request #${pr}"

            found="$(mktemp)"
            awk -F'\t' -v pr="$pr" '$1 == pr { print $2 }' "$pairs" | sort -u \
              | comm -12 - "$allowed" > "$found"

            # Warn rather than fail: a module repository may legitimately not
            # carry every category label.
            comm -13 "$known" "$found" | while IFS= read -r label; do
              echo "::warning::Not copied because this repository has no such label: ${label}"
            done

            copy="$(comm -12 "$found" "$known" | paste -sd, -)"
            if [ -z "$copy" ]; then
              echo "No release-note labels to copy."
              echo "::endgroup::"
              continue
            fi

            echo "Adding: ${copy}"
            gh issue edit "$pr" --add-label "$copy"

            # Only remove the triage label when it is actually present, so a
            # blanket "|| true" cannot mask a real failure.
            if gh issue view "$pr" --json labels --jq '.labels[].name' \
              | grep -Fxq "$TRIAGE_LABEL"; then
              gh issue edit "$pr" --remove-label "$TRIAGE_LABEL"
            fi

            echo "::endgroup::"
          done
