---
name: Copy Issue Labels to PR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: read

# No concurrency group on purpose. GitHub keeps only one pending run per group,
# so a third rapid push would evict the second one and its pull request would
# never be labeled. Every operation here is idempotent, so overlapping runs are
# harmless.

jobs:
  copy-labels:
    name: Copy release-note labels
    # A created, deleted, or force-pushed branch does not represent a merge,
    # and any of them can leave an unrelated commit as the tip.
    if: ${{ !github.event.created && !github.event.deleted && !github.event.forced }}
    runs-on: ubuntu-latest
    steps:
      - name: Copy labels from closing issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Labels worth carrying onto a pull request, matching the categories
          # and exclusions in .github/release.yml.
          RELEASE_NOTE_LABELS: |
            Type: Bug :bug:
            Type: Feature Request :heavy_plus_sign:
            Type: Documentation :page_facing_up:
            Type: CI :rocket:
            Type: Hygiene :broom:
            dependencies
            github-actions
            github_actions
            bug
            enhancement
            documentation
          TRIAGE_LABEL: "Needs: Triage :mag:"
        with:
          script: |
            // GraphQL rejects a query whose nesting could return more than
            // 500,000 nodes, so each level gets its own limit rather than
            // sharing one page size.
            const PULL_REQUEST_LIMIT = 20;
            const ISSUE_LIMIT = 20;
            const LABEL_LIMIT = 100;
            const REST_PAGE_SIZE = 100;

            function requiredEnv(name) {
              const value = process.env[name];
              if (!value) {
                throw new Error(`The ${name} environment variable is not set.`);
              }
              return value;
            }

            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const triageLabel = requiredEnv('TRIAGE_LABEL');
            const releaseNoteLabels = new Set(
              requiredEnv('RELEASE_NOTE_LABELS')
                .split('\n')
                .map((label) => label.trim())
                .filter(Boolean),
            );

            const MERGED_PULL_REQUESTS = `
              query(
                $owner: String!
                $name: String!
                $oid: GitObjectID!
                $pullRequests: Int!
                $issues: Int!
                $labels: Int!
              ) {
                repository(owner: $owner, name: $name) {
                  object(oid: $oid) {
                    ... on Commit {
                      associatedPullRequests(first: $pullRequests) {
                        pageInfo { hasNextPage }
                        nodes {
                          number
                          merged
                          baseRefName
                          closingIssuesReferences(first: $issues) {
                            pageInfo { hasNextPage }
                            nodes {
                              number
                              labels(first: $labels) {
                                pageInfo { hasNextPage }
                                nodes { name }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            function warnIfIncomplete(connection, limit, description) {
              if (connection?.pageInfo?.hasNextPage) {
                core.warning(`Read only the first ${limit} ${description}.`);
              }
            }

            // GitHub caps the pushed commit list at 20 entries. The tip alone
            // identifies the pull request for squash, merge, and rebase merges.
            function pushedCommits() {
              const listed = (context.payload.commits ?? [])
                .map((commit) => commit.id)
                .filter(Boolean);
              const total = context.payload.size ?? listed.length;

              if (listed.length < total) {
                core.warning(
                  `This push listed ${listed.length} of its ${total} commits. ` +
                    'Pull requests reachable only from the omitted commits are not labeled.',
                );
              }

              return [...new Set([context.sha, ...listed].filter(Boolean))];
            }

            async function mergedPullRequests(oid) {
              const result = await github.graphql(MERGED_PULL_REQUESTS, {
                owner,
                name: repo,
                oid,
                pullRequests: PULL_REQUEST_LIMIT,
                issues: ISSUE_LIMIT,
                labels: LABEL_LIMIT,
              });

              const associated = result.repository?.object?.associatedPullRequests;
              warnIfIncomplete(
                associated,
                PULL_REQUEST_LIMIT,
                `pull requests for commit ${oid}`,
              );

              // A commit can also be associated with a pull request that merged
              // somewhere else, so confirm this one merged into the pushed branch.
              return (associated?.nodes ?? []).filter(
                (pullRequest) =>
                  pullRequest?.merged && pullRequest.baseRefName === branch,
              );
            }

            function labelsToCopy(pullRequest) {
              const names = new Set();
              const issues = pullRequest.closingIssuesReferences;
              warnIfIncomplete(
                issues,
                ISSUE_LIMIT,
                `closing issues for #${pullRequest.number}`,
              );

              for (const issue of issues?.nodes ?? []) {
                warnIfIncomplete(
                  issue.labels,
                  LABEL_LIMIT,
                  `labels on issue #${issue.number}`,
                );

                for (const label of issue.labels?.nodes ?? []) {
                  if (releaseNoteLabels.has(label.name)) {
                    names.add(label.name);
                  }
                }
              }

              return [...names].sort();
            }

            async function repositoryLabels() {
              const labels = await github.paginate(
                github.rest.issues.listLabelsForRepo,
                { owner, repo, per_page: REST_PAGE_SIZE },
              );
              return new Set(labels.map((label) => label.name));
            }

            // Adding a label the repository does not have creates it, so only
            // send known labels rather than inventing them in module repositories.
            async function addExistingLabels(number, names, known) {
              const present = names.filter((name) => known.has(name));
              const missing = names.filter((name) => !known.has(name));

              if (missing.length > 0) {
                core.warning(
                  `#${number}: not copied because this repository has no such label: ${missing.join(', ')}`,
                );
              }

              if (present.length === 0) {
                return false;
              }

              core.info(`#${number}: adding ${present.join(', ')}`);
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: number,
                labels: present,
              });
              return true;
            }

            async function removeTriageLabel(number) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: number,
                  name: triageLabel,
                });
              } catch (error) {
                // The pull request simply was not awaiting triage.
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const pullRequests = new Map();
            for (const oid of pushedCommits()) {
              for (const pullRequest of await mergedPullRequests(oid)) {
                pullRequests.set(pullRequest.number, pullRequest);
              }
            }

            if (pullRequests.size === 0) {
              core.info('This push merged no pull requests.');
              return;
            }

            const known = await repositoryLabels();

            for (const pullRequest of pullRequests.values()) {
              const names = labelsToCopy(pullRequest);

              if (names.length === 0) {
                core.info(`#${pullRequest.number}: no release-note labels to copy.`);
                continue;
              }

              if (await addExistingLabels(pullRequest.number, names, known)) {
                await removeTriageLabel(pullRequest.number);
              }
            }
