---
name: Copy Issue Labels to PR

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  issues: write
  pull-requests: read

jobs:
  copy-labels:
    name: Copy release-note labels
    runs-on: ubuntu-latest
    steps:
      - name: Copy labels from closing issues
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          is_release_note_label() {
            case "$1" in
              "Type: Bug :bug:" | \
              "Type: Feature Request :heavy_plus_sign:" | \
              "Type: Documentation :page_facing_up:" | \
              "Type: CI :rocket:" | \
              "Type: Hygiene :broom:" | \
              dependencies | \
              github-actions | \
              github_actions | \
              bug | \
              enhancement | \
              documentation)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -t closing_issues < <(
            gh pr view "$PR_NUMBER" \
              --repo "$REPOSITORY" \
              --json closingIssuesReferences \
              --jq '.closingIssuesReferences[].number'
          )

          if [ "${#closing_issues[@]}" -eq 0 ]; then
            echo "No closing issues found."
            exit 0
          fi

          labels_file="$(mktemp)"
          for issue in "${closing_issues[@]}"; do
            gh issue view "$issue" \
              --repo "$REPOSITORY" \
              --json labels \
              --jq '.labels[].name' >> "$labels_file"
          done

          mapfile -t labels < <(
            while IFS= read -r label; do
              if is_release_note_label "$label"; then
                printf '%s\n' "$label"
              fi
            done < "$labels_file" | sort -u
          )

          if [ "${#labels[@]}" -eq 0 ]; then
            echo "No release-note labels found on closing issues."
            exit 0
          fi

          for label in "${labels[@]}"; do
            echo "Adding label: ${label}"
            gh issue edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label "$label"
          done

          gh issue edit "$PR_NUMBER" --repo "$REPOSITORY" --remove-label "Needs: Triage :mag:" || true
