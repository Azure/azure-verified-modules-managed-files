---
name: PR Check
on:
  pull_request:
    types: ['opened', 'reopened', 'synchronize']
  merge_group:
  workflow_dispatch:
    inputs:
      authoringSource:
        description: Authoring module source.
        required: false
        type: choice
        options:
          - gallery
          - repo
        default: gallery
      authoringRef:
        description: Gallery version or blank for latest; repo full commit SHA, branch, tag, or blank for the latest stable tag.
        required: false
        type: string
        default: ''

jobs:
  run-managed-workflow:
    uses: Azure/azure-verified-modules-tools/.github/workflows/terraform-module.yml@main
    name: run managed workflow
    with:
      authoringSource: ${{ inputs.authoringSource || 'gallery' }}
      authoringRef: ${{ inputs.authoringRef || '' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
